<head>

<style>
:root{--bg:#f1f0fa;--card:#fff;--ink:#1b1a33;--sub:#5d5b7a;--v:#0a8f9c;--vb:#d6f3f5;--r:#c9701a;--rb:#fdebd3;--ok:#1f9d55;--no:#d7384a;--line:#d6d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1,h2{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;margin:0 0 8px}
h1{font-size:42px;line-height:1.15;margin-top:26px}
h2{font-size:28px}
p{margin:0 0 12px}.sub{color:var(--sub);font-size:14px}
button,input{font:inherit}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:var(--bg);font-family:'Do Hyeon',sans-serif;font-size:20px;cursor:pointer;margin-top:12px}
.btn:active{transform:scale(.98)}.btn:focus-visible,input:focus-visible,.cell:focus-visible,.card:focus-visible{outline:3px solid var(--v);outline-offset:2px}
input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:18px}
.q{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;width:100%;text-align:left;color:var(--ink);cursor:pointer}
.q .ic{font-size:30px}.q b{display:block;font-size:17px}
.q.done{border-color:var(--ok)}.q .st{margin-left:auto;font-weight:700;font-size:14px;color:var(--sub)}.q.done .st{color:var(--ok)}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{min-height:84px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;line-height:1.35;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.card.v{background:var(--vb);border-color:var(--v)}.card.r{background:var(--rb);border-color:var(--r)}
.card.back{background:var(--ink);color:var(--bg);font-size:26px}
.card.ok{opacity:.35;pointer-events:none}
.cell{height:92px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;padding:4px}
.cell.bad{background:var(--vb);border-color:var(--no)}.cell.good{background:var(--rb);border-color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--v);width:100%}
.res{text-align:center;padding:18px;border:3px solid;border-radius:18px;margin:14px 0;background:var(--card)}
.res.win{border-color:var(--ok)}.res.lose{border-color:var(--no)}
.big{font-family:'Do Hyeon',sans-serif;font-size:36px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ox button{height:90px;font-family:'Do Hyeon',sans-serif;font-size:46px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fb{padding:12px;border-radius:12px;background:var(--card);border:2px solid var(--line);margin-top:12px}
.stamp{border:5px double var(--ok);color:var(--ok);border-radius:18px;padding:16px;text-align:center;transform:rotate(-3deg);margin:20px 8px}
.stamp .big{font-size:44px}
.code{font-family:monospace;font-size:26px;letter-spacing:4px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* modern UI */
:root{--bg:#f4f5ff;--card:#fff;--ink:#12122a;--sub:#6b6d8f;--v:#6366f1;--vb:#e8e9ff;--r:#d97706;--rb:#fff1d6;--ok:#10b981;--no:#f43f5e;--line:#e3e4f5;--g:linear-gradient(135deg,#6366f1,#ec4899)}

.bar i{background:var(--g);border-radius:999px}
.card{border-radius:20px;border:1px solid var(--line);box-shadow:0 8px 20px -14px rgba(60,60,140,.6);font-weight:500;transition:transform .15s}
.card:active{transform:scale(.95)}
.card.back{background:var(--g);color:#fff;border-color:transparent;font-weight:900}
.card.v{background:var(--vb);border-color:var(--v)}
.card.r{background:var(--rb);border-color:var(--r)}
.cell{border-radius:22px;border:1px solid var(--line);box-shadow:0 8px 20px -14px rgba(60,60,140,.6);font-size:14px}
.cell:active{transform:scale(.93)}
.res{border-radius:28px;border-width:2px;box-shadow:0 20px 40px -24px rgba(60,60,140,.6)}
.big{font-size:34px}
.ox button{border-radius:26px;border:1px solid var(--line);box-shadow:0 10px 24px -16px rgba(60,60,140,.6);font-size:44px}
.ox button:active{transform:scale(.95)}
.fb{border-radius:22px;border:1px solid var(--line);padding:16px;box-shadow:0 10px 30px -22px rgba(60,60,140,.6)}
.stamp{border:2px solid var(--ok);border-radius:30px;background:color-mix(in srgb,var(--ok) 12%,var(--card));transform:rotate(-2deg);box-shadow:0 24px 44px -26px var(--ok)}
.stamp .big{background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:46px}
.code{display:inline-block;margin-top:6px;padding:6px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:22px}
/* space theme */
:root{--bg:#050816;--card:#0d1230;--ink:#e8f0ff;--sub:#8fa3d6;--v:#22d3ee;--vb:#0c2a4a;--r:#ffb020;--rb:#3a2a0a;--ok:#39ff9a;--no:#ff4d6d;--line:#1f2a5c;--g:linear-gradient(135deg,#22d3ee,#818cf8);--glow:0 0 22px -8px #22d3ee;color-scheme:dark}

body{background-color:var(--bg);background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#9ef,transparent),radial-gradient(1.5px 1.5px at 150px 60px,#fff,transparent),radial-gradient(1px 1px at 60px 170px,#fffc,transparent),radial-gradient(70% 40% at 100% 0%,rgba(139,92,246,.35),transparent),radial-gradient(60% 40% at 0% 25%,rgba(34,211,238,.18),transparent),radial-gradient(70% 35% at 50% 110%,rgba(236,72,153,.2),transparent);background-size:200px 200px,240px 240px,170px 170px,220px 220px,100% 100%,100% 100%,100% 100%;background-repeat:repeat,repeat,repeat,repeat,no-repeat,no-repeat,no-repeat;background-attachment:fixed}
h1{background:linear-gradient(120deg,#22d3ee,#a78bfa 60%,#f0abfc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(34,211,238,.35))}
.big,.code,.top,#tm{font-family:'Orbitron','Noto Sans KR',sans-serif}
.btn{color:#031022;box-shadow:0 0 26px -6px #22d3ee}
.btn:hover{box-shadow:0 0 34px -4px #818cf8}
input{background:var(--card);color:var(--ink);border-color:var(--line)}
input:focus{border-color:var(--v);box-shadow:var(--glow)}
.q,.fb,.top{background:rgba(13,18,48,.72);border:1px solid rgba(34,211,238,.28);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.05)}
.q:hover{border-color:var(--v)}

.q .st{background:rgba(34,211,238,.14);color:var(--v)}
.q.done{border-color:var(--ok);background:rgba(57,255,154,.08);box-shadow:0 0 24px -8px var(--ok)}

.q.done .st{background:var(--ok);color:#031022}
.bar{background:#121a44}
.bar i{background:linear-gradient(90deg,#22d3ee,#a78bfa);box-shadow:0 0 12px #22d3ee}
.card,.cell,.ox button{background:var(--card);border:1px solid rgba(34,211,238,.28);box-shadow:var(--glow)}
.card.back{background:linear-gradient(135deg,#0f3b6b,#3b2a8a);color:#9ef;border-color:rgba(34,211,238,.6);text-shadow:0 0 10px #22d3ee}
.card.v{background:var(--vb);border-color:var(--v)}
.card.r{background:var(--rb);border-color:var(--r);box-shadow:0 0 22px -8px var(--r)}
.cell.bad{background:#2a0f2e;border-color:var(--no);box-shadow:0 0 22px -8px var(--no)}
.cell.good{background:var(--rb);border-color:var(--ok);box-shadow:0 0 22px -8px var(--ok)}
.res{background:rgba(13,18,48,.78)}
.res.win{border-color:var(--ok);box-shadow:0 0 36px -12px var(--ok)}
.res.lose{border-color:var(--no);box-shadow:0 0 36px -12px var(--no)}
.stamp{border-color:var(--ok);background:rgba(57,255,154,.07);box-shadow:0 0 44px -14px var(--ok)}
.stamp .big{background:linear-gradient(120deg,#39ff9a,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:38px}
.code{background:var(--ok);color:#031022;box-shadow:0 0 22px -4px var(--ok)}
/* monster quest */
#mb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:#2b2d42;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(0,0,0,.5)}
.mz{--sky:#bfe9ff;--sky2:#e8f8ff;--grass:#8fdc7a;--grass2:#6cc65f;--card:#fff;--ink:#2b2d42;--sub:#6a6d8a;--pink:#ff7aa8;--ok:#1fae6b;--no:#e5484d;--bg:#fffbe9;background:var(--bg);color:var(--ink);border:4px solid #2b2d42;border-radius:28px;font-family:'Jua','Noto Sans KR',sans-serif;font-size:17px;line-height:1.5;margin-top:10px;letter-spacing:0}
.mz h2{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:26px;letter-spacing:0;margin:0 0 6px}
.mz p{margin:0 0 10px}.mz .sub{color:var(--sub);font-size:15px}
@media (prefers-reduced-motion:reduce){.mz .mon,.mz .ball.on{animation:none}}
.mz .zb,.mz .opt{font:inherit;cursor:pointer;display:block;width:100%;text-align:center;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;transition:transform .08s,box-shadow .08s}
.mz .zb:active,.mz .opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mz .zb:focus-visible,.mz .opt:focus-visible,.mz input:focus-visible,.mz .slot:focus-visible{outline:4px solid var(--pink);outline-offset:2px}

.mz .opt[disabled]{opacity:.4;pointer-events:none;text-decoration:line-through}
.mz input{font:inherit;width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);font-size:18px;margin-bottom:12px}
.mz .zbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;margin-bottom:12px;font-size:16px}
.mz .goal{height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;margin:0 0 14px}
.mz .goal i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,var(--pink));width:0;transition:width .5s}
.mz .dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mz .slot{font:inherit;color:var(--ink);cursor:pointer;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:8px 4px 10px;text-align:center;box-shadow:0 4px 0 var(--ink);font-size:15px}
.mz .slot:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mz .slot svg{width:100%;max-width:88px;height:auto;display:block;margin:0 auto}
.mz .slot.unk svg{filter:brightness(0);opacity:.22}
.mz .slot.fled svg{filter:grayscale(1);opacity:.6}
.mz .slot.got{background:linear-gradient(#fff6c8,var(--card));pointer-events:none}
.mz .slot small{display:block;font-size:12px;color:var(--sub)}
.mz .field{position:relative;height:250px;border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky),var(--sky2) 58%,var(--grass) 58%);margin-bottom:12px}
.mz .field:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:110px;border-radius:50%;background:var(--grass2)}
.mz .pad{position:absolute;left:50%;bottom:46px;width:190px;height:44px;margin-left:-95px;border-radius:50%;background:var(--grass2);border:3px solid rgba(0,0,0,.12);z-index:1}

.mz .mon svg{width:100%;display:block}
.mz .mon.shake{animation:shake .5s}.mon.zip{transform:scale(0);opacity:0}
.mz .plate{position:absolute;left:10px;top:10px;z-index:3;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;min-width:150px;font-size:15px}
.mz .hp{height:10px;border:2px solid var(--ink);border-radius:9px;background:var(--bg);overflow:hidden;margin-top:3px}
.mz .hp i{display:block;height:100%;width:100%;background:var(--ok);transition:width .8s}
.mz .ball{position:absolute;left:50%;bottom:78px;margin-left:-32px;width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:linear-gradient(#ff5d5d 0 45%,var(--ink) 45% 55%,#fff 55%);z-index:4;display:none}
.mz .ball:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.mz .ball.on{display:block;animation:wig .7s 3}
.mz .spark{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-size:56px;pointer-events:none}
.mz .dlg{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--ink)}
.mz .dlg .tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:0 12px;font-size:14px;margin-bottom:6px}
.mz .msg{padding:10px 12px;border-radius:14px;margin:0 0 12px;border:3px dashed var(--ink)}
.mz .msg.good{border-color:var(--ok)}.msg.bad{border-color:var(--no)}
.mz .cert{text-align:center;background:linear-gradient(#fff6c8,var(--card));border:4px solid var(--ink);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--ink);margin:14px 0}

@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-14px) rotate(-6deg)}75%{transform:translateX(14px) rotate(6deg)}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{width:48px;height:48px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(13,18,48,.7);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center}
.chip.on{border-color:#fff;box-shadow:0 0 0 3px rgba(34,211,238,.6)}
.world{position:relative;height:440px;border-radius:26px;overflow:hidden;border:1px solid rgba(34,211,238,.35);background-color:rgba(7,10,32,.9);background-image:radial-gradient(80% 50% at 50% 45%,rgba(34,211,238,.12),transparent),radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#9ef,transparent),radial-gradient(1.5px 1.5px at 150px 60px,#fff,transparent);background-size:100% 100%,200px 200px,240px 240px,170px 170px;cursor:pointer;touch-action:manipulation;margin-bottom:12px;box-shadow:0 0 30px -12px #22d3ee}
.pl{position:absolute;border-radius:50%;box-shadow:inset -8px -8px 16px rgba(0,0,0,.4)}
.al{position:absolute;transform:translate(-50%,-50%);width:92px;background:none;border:0;padding:0;cursor:pointer;animation:fl 3s ease-in-out infinite;z-index:2}
.al:nth-of-type(2){animation-delay:-.8s}.al:nth-of-type(3){animation-delay:-1.6s}
.al svg{width:100%;display:block;filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
.al.ok svg{filter:drop-shadow(0 0 14px #39ff9a)}
.nm{display:block;text-align:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000;white-space:nowrap}
.me{position:absolute;width:62px;transform:translate(-50%,-100%);z-index:5;pointer-events:none}
.me .bd{transition:transform .15s}.me.walk .bd svg{animation:wk .3s infinite alternate}
.me svg{display:block;width:100%}
.portal{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;background:conic-gradient(#22d3ee,#a78bfa,#f0abfc,#22d3ee);box-shadow:0 0 44px #a78bfa;font-size:34px;animation:sp 4s linear infinite;z-index:3}

function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();mst=ctx.createGain();mst.gain.value=.55;mst.connect(ctx.destination);dl=ctx.createDelay(1);dl.delayTime.value=.36;const f=ctx.createGain();f.gain.value=.38;dl.connect(f);f.connect(dl);dl.connect(mst);nb=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

function kick(t,v){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(mst);o.start(t);o.stop(t+.22)}

function step(t){const s=n%16,bar=Math.floor(n/16)%4,lp=Math.floor(n/64)%2;
if(mode=='space'){
if(s%4==0)kick(t,.55);if(s==4||s==12)nz(t,.13,.14,1500);if(s%2==1)nz(t,.04,.05,7000);
if([0,3,6,8,10,12,14].includes(s))note(SB[bar]*(s==6||s==14?2:1),t,.2,'sawtooth',.06);

if(s%4==0)note(AB[bar],t,.16,'triangle',.11);if(s%4==2)note(AB[bar]*2,t,.1,'triangle',.08);

function loop(){if(!on||!ok)return;run=true;const L=mode=='space'?.118:.1;if(nt<ctx.currentTime)nt=ctx.currentTime+.06;while(nt<ctx.currentTime+.3){step(nt);nt+=L;n++}tm=setTimeout(loop,60)}

return{mode(k){if(k==mode)return;mode=k;n=0;nt=0;if(on&&ok){clearTimeout(tm);loop()}}}}

 h:'익명이라고 해서 늘 추적할 수 없는 건 아니에요.',e:'온라인에서의 비방도 현실의 명예훼손이 될 수 있어요. 익명이어도 상대의 상처는 진짜예요.'},
{n:'피싱이',t:'가짜 링크 몬스터',c:'#fdba74',lv:10,b:`<path d="M24 66L8 52v30zM96 66l16-14v30z" fill="#fb923c"/>`,a:`<path d="M60 36Q60 8 82 10" stroke="#9a3412" stroke-width="3" fill="none"/><path d="M82 10v10q0 8-7 6" stroke="#9a3412" stroke-width="3" fill="none" stroke-linecap="round"/>`,
 q:'피싱이가 나타났다! 친구 계정이 "이 링크 누르면 아이템 공짜!" 하고 수상한 링크를 보냈다. 스노 크래시의 바이러스처럼 가상의 정보도 현실에 피해를 줄 수 있다. 어떻게 할까?',
 o:['링크를 누르지 않고 친구에게 따로 확인한 뒤 신고한다','일단 눌러 보고 이상하면 지운다','다른 친구들에게도 똑같이 전달해 준다'],
 h:'미끼를 덥석 물면 안 돼요!',e:'『스노 크래시』의 바이러스는 가상에서 퍼져 현실의 사람을 해쳐요. 수상한 링크는 누르지 말고 확인하고 신고해요.'},
{n:'메타봉',t:'현실 도피 몬스터',c:'#818cf8',lv:12,vr:1,b:`<ellipse cx="60" cy="70" rx="56" ry="12" fill="none" stroke="#fde68a" stroke-width="4" transform="rotate(-15 60 70)"/>`,a:`<circle cx="22" cy="24" r="3" fill="#fde68a"/><circle cx="100" cy="30" r="2.5" fill="#fde68a"/><circle cx="90" cy="12" r="2" fill="#fff"/>`,
 q:'메타봉이 나타났다! 현실이 힘들어서 가상 세계에서만 지내려는 사람이 늘고 있다. 『스노 크래시』의 시각으로 가장 알맞은 생각은?',
 o:['가상이 현실의 어려움을 가려 주는 도피처가 될 수 있으니 현실 문제도 함께 돌아봐야 한다','가상이 즐거우면 현실은 신경 쓰지 않아도 된다','가상은 현실과 전혀 무관해서 걱정할 필요가 없다'],
 h:'소설 속 히로는 현실과 가상에서의 모습이 전혀 달라요.',e:'『스노 크래시』는 가상의 화려함 뒤에 있는 현실의 결핍도 함께 보여 줘요. 가상을 즐기는 만큼 현실도 돌봐야 해요.'}
];
function mon(i){const m=M[i],eye=m.vr?'#7df9ff':'#222';
return `<svg viewBox="0 0 120 120" aria-hidden="true">${m.b}<ellipse cx="38" cy="104" rx="12" ry="7" fill="${m.c}" stroke="rgba(0,0,0,.15)" stroke-width="2"/><ellipse cx="82" cy="104" rx="12" ry="7" fill="${m.c}" stroke="rgba(0,0,0,.15)" stroke-width="2"/><ellipse cx="60" cy="68" rx="40" ry="35" fill="${m.c}" stroke="rgba(0,0,0,.15)" stroke-width="2"/><ellipse cx="60" cy="80" rx="24" ry="18" fill="#fff" opacity=".45"/>${m.vr?'<rect x="30" y="52" width="60" height="24" rx="12" fill="#1e1b4b"/>':''}<circle cx="46" cy="64" r="7" fill="${eye}"/><circle cx="74" cy="64" r="7" fill="${eye}"/><circle cx="48.5" cy="61" r="2.6" fill="#fff"/><circle cx="76.5" cy="61" r="2.6" fill="#fff"/><circle cx="33" cy="80" r="5" fill="#ff8fab" opacity=".75"/><circle cx="87" cy="80" r="5" fill="#ff8fab" opacity=".75"/><path d="M53 80q7 7 14 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>${m.a}</svg>`}

let zs=[],cur=-1,opts=[];
const caught=()=>zs.filter(s=>s.r=='got').length;
const stars=()=>zs.filter(s=>s.r=='got'&&s.star).length;

function dex(){const c=caught(),done=zs.every(s=>s.r=='got'||s.r=='fled');
app.innerHTML=`<div class="zbar"><span>🎒 ${name}</span><span>도감 ${c}/${M.length}</span></div><div class="goal" role="progressbar" aria-valuenow="${c}" aria-valuemax="${GOAL}"><i style="width:${Math.min(100,c/GOAL*100)}%"></i></div>
<h2>🔥 FINAL STAGE: 풀숲의 접속몬스터</h2><p class="sub">목표: ${GOAL}마리 이상 잡기. 놓친 몬스터는 다시 도전할 수 있어요.</p>
<div class="dex">${M.map((m,i)=>{const s=zs[i];return `<button class="slot ${s.r=='got'?'got':s.r=='fled'?'fled':'unk'}" data-i="${i}">${mon(i)}${s.r=='got'?m.n+(s.star?' ⭐':'')+'<small>잡았다!</small>':s.r=='fled'?m.n+'<small>다시 도전</small>':'???<small>야생</small>'}</button>`}).join('')}</div>
${c>=GOAL?`<button class="zb main" id="fin" style="margin-top:16px">🏆 목표 달성! 결과 보기</button>`:done?`<p class="sub" style="margin-top:14px;text-align:center">아직 목표에 못 닿았어요. 도망친 몬스터에게 다시 도전해요!</p>`:''}`;
document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>battle(+b.dataset.i));if(c>=GOAL)$('#fin').onclick=zfinish;app.insertAdjacentHTML('beforeend','<button class="zb" id="ex" style="margin-top:14px">우주 월드로 나가기</button>');$('#ex').onclick=hub}

function battle(i){cur=i;const m=M[i],s=zs[i];s.tries=0;
opts=m.o.map((t,j)=>({t,ok:j==0})).sort(()=>Math.random()-.5);
app.innerHTML=`<div class="zbar"><span>🔴 접속볼 <b id="bl">2</b>개</span><span>목표 ${caught()}/${GOAL}</span></div>
<div class="field"><div class="plate"><b>${m.n}</b> Lv.${m.lv}<div class="hp"><i id="hp"></i></div></div><div class="pad"></div><div class="mon" id="mn">${mon(i)}</div><div class="ball" id="ball"></div><div class="spark" id="sp"></div><div class="hero" id="hero">${avSVG(av)}</div><div class="bub" id="bub"></div></div>
<div class="dlg"><span class="tag">${m.t}</span><p>${m.q}</p><div id="msgbox"></div><div id="ops">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(+b.dataset.k,b))}

function ans(k,btn){const m=M[cur],s=zs[cur],o=opts[k];s.tries++;$('#bl').textContent=2-s.tries;
if(o.ok){s.star=s.tries==1;lockOpts();$('#hp').style.width='0%';
$('#msgbox').innerHTML=`<div class="msg good">접속볼을 던졌다!</div>`;
const hero=$('#hero');hero.classList.add('thr');
setTimeout(()=>{$('#ball').className='ball fly'},350);
setTimeout(()=>{$('#mn').classList.add('zip');$('#ball').className='ball on'},1000);
setTimeout(()=>{$('#ball').className='ball';hero.classList.remove('thr');hero.innerHTML=avSVG(av,'ball');hero.classList.add('hop');$('#bub').classList.add('pop');
$('#sp').innerHTML=Array.from({length:18},(_,i)=>`<i style="--dx:${Math.round((Math.random()*2-1)*170)}px;--dy:${Math.round(-20-Math.random()*150)}px;animation-delay:${(Math.random()*.25).toFixed(2)}s">${['⭐','✨','🎉','💫','💖'][i%5]}</i>`).join('');s.r='got';
$('#msgbox').innerHTML=`<div class="msg good"><b>${m.n}을(를) 잡았다!${s.star?' ⭐ 한 번에 성공!':''}</b><br>${m.e}</div><button class="zb main" id="nx">도감으로 돌아가기</button>`;$('#nx').onclick=dex},3200)}
else if(s.tries==1){btn.disabled=true;$('#mn').classList.add('shake');setTimeout(()=>$('#mn').classList.remove('shake'),500);
$('#msgbox').innerHTML=`<div class="msg bad">앗, 접속볼이 튕겨 나왔다! 한 번 더 도전할 수 있어요.<br>💡 힌트: ${m.h}</div>`}
else{lockOpts();s.r='fled';$('#mn').style.transform='translateX(260px)';$('#mn').style.opacity=0;
$('#msgbox').innerHTML=`<div class="msg bad"><b>${m.n}이(가) 도망쳤다…</b><br>${m.e}</div><button class="zb main" id="nx">도감으로 돌아가기</button>`;$('#nx').onclick=dex}}
function lockOpts(){document.querySelectorAll('.opt').forEach(b=>b.disabled=true)}

function zoo(){if(!zs.length)zs=M.map(()=>({r:'new',tries:0,star:false}));Mu.mode('adv');app.className='mz';dex()}
function zfinish(){sc.c=caught();done.c=true;final()}
/* Final */
function final(){stop();app.className='';const t=sc.m+sc.w+sc.o*20+sc.c*20,d=new Date();
const stamp=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
let h=7;for(const ch of name+stamp+t)h=(h*31+ch.charCodeAt(0))%1679616;
const grade=t>=420?'S':t>=350?'A':'B';
app.innerHTML=`<div class="stamp"><div style="width:96px;margin:-6px auto 4px">${avSVG(av)}</div><div class="big">ALL CLEAR</div><div style="font-weight:700;font-size:20px">${name}</div><div class="sub">${stamp}</div><div class="code">${h.toString(36).toUpperCase().padStart(4,'0')}</div></div>
<div class="res win"><div class="big">등급 ${grade}</div><p>짝 맞추기 남은 시간 ${sc.m}초 · 방어전 ${sc.w}점 · 고전 퀴즈 ${sc.o}/5 · 몬스터 ${sc.c}/6마리</p></div>
<div class="fb"><b>🦋 한 줄 생각 나누기</b><p style="margin:6px 0">① 호접지몽처럼, 내가 가상과 현실을 나누는 기준은 무엇인가?</p><p style="margin:6px 0">② 스노 크래시의 바이러스가 현실에서 일어난다면, 오늘 우리 일상의 무엇과 닮았을까?</p><p style="margin:6px 0">③ 내가 꾸민 아바타는 현실의 나와 얼마나 닮았을까? 왜 그렇게 꾸몄을까?</p></div>
<p class="sub" style="text-align:center">이 화면을 선생님께 보여주면 보상을 받을 수 있어요. 가상에서 한 행동은 현실로 이어진다는 것, 기억하죠?</p>
<button class="btn" id="re">처음부터 다시 하기</button>`;
$('#re').onclick=()=>{done={m:false,w:false,o:false,c:false};sc={m:0,w:0,o:0,c:0};zs=[];title()}}
title();
</script>
</body>
</html>
